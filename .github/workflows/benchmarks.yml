name: Benchmarks

# Run benchmarks in the cloud and upload results
on:
  # Allow manual triggering
  workflow_dispatch:
  # Run on pushes to main (optional - uncomment if desired)
  # push:
  #   branches: [main]
  # Run weekly to track performance over time
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday at midnight

permissions:
  contents: read

env:
  GO111MODULE: on

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: "**/go.sum"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib numpy

      - name: Run benchmarks
        working-directory: benchmark/shmemtcp
        run: |
          echo "Running benchmarks with --run flag to force fresh execution..."
          python3 benchmark_runner.py --run

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: |
            benchmark/shmemtcp/out/linux/benchmark_results.json
            benchmark/shmemtcp/out/linux/benchmark_results.txt
            benchmark/shmemtcp/out/linux/*.png
          retention-days: 90

      - name: Display benchmark summary
        if: always()
        working-directory: benchmark/shmemtcp
        run: |
          echo "=== Benchmark Summary ==="
          if [ -f out/linux/benchmark_results.txt ]; then
            echo "Latest benchmark results:"
            tail -50 out/linux/benchmark_results.txt
          else
            echo "No benchmark results found"
          fi

      - name: Check for performance regressions
        if: success()
        working-directory: benchmark/shmemtcp
        run: |
          echo "Checking benchmark results for obvious issues..."
          if [ -f out/linux/benchmark_results.json ]; then
            echo "✓ Benchmark results file generated successfully"
            # Check if we have results
            if grep -q "benchmarks" out/linux/benchmark_results.json; then
              echo "✓ Benchmark data present in results file"
            else
              echo "⚠ Warning: No benchmark data found in results file"
              exit 1
            fi
          else
            echo "✗ Error: Benchmark results file not found"
            exit 1
          fi
