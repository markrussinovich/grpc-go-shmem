// benchmark.proto defines the gRPC service used by the SHM demo. It mirrors
// the BenchmarkService shape used by both grpc-go-shmem and grpc-dotnet-shm
// benchmarks so the demo workload matches a real engineering benchmark:
//   - UnaryCall: request/response echo of a configured size.
//   - StreamingCall: bidirectional streaming ping-pong of configured size.
//
// The same generated service is served identically over TCP, UDS, and SHM;
// only the listener (server) and channel/dial options (client) differ.

syntax = "proto3";

package shmdemo;

option go_package = "shmdemo/proto/shmdemobench";
option csharp_namespace = "ShmDemo.Bench";

// BenchmarkService is a minimal echo service for transport benchmarking.
service BenchmarkService {
  // UnaryCall sends a request and receives a response of the configured size.
  rpc UnaryCall(SimpleRequest) returns (SimpleResponse);

  // StreamingCall is a bidirectional stream used for single-stream ping-pong
  // (latency) and one-way blast (throughput) measurements.
  rpc StreamingCall(stream SimpleRequest) returns (stream SimpleResponse);
}

// Payload carries the raw message bytes.
message Payload {
  bytes body = 1;
}

// SimpleRequest is a benchmark request.
message SimpleRequest {
  // Desired size in bytes of the response payload.
  int32 response_size = 1;

  // Request payload.
  Payload payload = 2;
}

// SimpleResponse is a benchmark response.
message SimpleResponse {
  // Response payload.
  Payload payload = 1;
}
