<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <title>Roundtrip Latency Comparison: TCP vs Unix Socket vs Shared Memory</title>

  <!-- Background -->
  <rect width="800" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">
    Roundtrip Latency Comparison (Lower is Better)
  </text>
  <text x="400" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
    AMD EPYC 7763, Linux, gRPC-Go v1.68.x
  </text>

  <!-- Y-axis (log scale representation) -->
  <line x1="100" y1="70" x2="100" y2="420" stroke="#333" stroke-width="2"/>
  <text x="50" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333" transform="rotate(-90 50 250)">
    Latency (nanoseconds, log scale)
  </text>

  <!-- Y-axis labels -->
  <text x="95" y="420" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#666">100</text>
  <text x="95" y="350" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#666">500</text>
  <text x="95" y="280" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#666">2,000</text>
  <text x="95" y="210" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#666">5,000</text>
  <text x="95" y="140" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#666">10,000</text>
  <text x="95" y="80" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#666">20,000</text>

  <!-- Grid lines -->
  <line x1="100" y1="420" x2="750" y2="420" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="100" y1="350" x2="750" y2="350" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="100" y1="280" x2="750" y2="280" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="100" y1="210" x2="750" y2="210" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="100" y1="140" x2="750" y2="140" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="100" y1="70" x2="750" y2="70" stroke="#e0e0e0" stroke-width="1"/>

  <!-- X-axis -->
  <line x1="100" y1="420" x2="750" y2="420" stroke="#333" stroke-width="2"/>
  <text x="425" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
    Payload Size
  </text>

  <!-- X-axis labels -->
  <text x="180" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">64 B</text>
  <text x="340" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">256 B</text>
  <text x="500" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">1 KB</text>
  <text x="660" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">4 KB</text>

  <!-- Bar groups - 64B -->
  <!-- TCP: 17897ns = ~78 from top (scale: 20000 max, 100 min, log) -->
  <rect x="135" y="85" width="30" height="335" fill="#e74c3c" rx="2"/>
  <!-- UDS: 2459ns = ~270 from top -->
  <rect x="165" y="275" width="30" height="145" fill="#f39c12" rx="2"/>
  <!-- SHM: 307ns = ~380 from top -->
  <rect x="195" y="382" width="30" height="38" fill="#27ae60" rx="2"/>

  <!-- Bar groups - 256B -->
  <rect x="295" y="82" width="30" height="338" fill="#e74c3c" rx="2"/>
  <rect x="325" y="278" width="30" height="142" fill="#f39c12" rx="2"/>
  <rect x="355" y="378" width="30" height="42" fill="#27ae60" rx="2"/>

  <!-- Bar groups - 1KB -->
  <rect x="455" y="87" width="30" height="333" fill="#e74c3c" rx="2"/>
  <rect x="485" y="270" width="30" height="150" fill="#f39c12" rx="2"/>
  <rect x="515" y="380" width="30" height="40" fill="#27ae60" rx="2"/>

  <!-- Bar groups - 4KB -->
  <rect x="615" y="77" width="30" height="343" fill="#e74c3c" rx="2"/>
  <rect x="645" y="260" width="30" height="160" fill="#f39c12" rx="2"/>
  <rect x="675" y="375" width="30" height="45" fill="#27ae60" rx="2"/>

  <!-- Value labels -->
  <text x="150" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">17.9µs</text>
  <text x="180" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">2.5µs</text>
  <text x="210" y="377" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#27ae60" font-weight="bold">307ns</text>

  <text x="310" y="77" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">18.4µs</text>
  <text x="340" y="273" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">2.4µs</text>
  <text x="370" y="373" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#27ae60" font-weight="bold">366ns</text>

  <text x="470" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">17.7µs</text>
  <text x="500" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">2.6µs</text>
  <text x="530" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#27ae60" font-weight="bold">335ns</text>

  <text x="630" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">19.9µs</text>
  <text x="660" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">3.5µs</text>
  <text x="690" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#27ae60" font-weight="bold">550ns</text>

  <!-- Legend -->
  <rect x="550" y="55" width="180" height="80" fill="white" stroke="#ccc" stroke-width="1" rx="4"/>
  <rect x="560" y="70" width="15" height="15" fill="#e74c3c" rx="2"/>
  <text x="580" y="82" font-family="Arial, sans-serif" font-size="11" fill="#333">TCP Loopback</text>
  <rect x="560" y="92" width="15" height="15" fill="#f39c12" rx="2"/>
  <text x="580" y="104" font-family="Arial, sans-serif" font-size="11" fill="#333">Unix Socket</text>
  <rect x="560" y="114" width="15" height="15" fill="#27ae60" rx="2"/>
  <text x="580" y="126" font-family="Arial, sans-serif" font-size="11" fill="#333">Shared Memory</text>

  <!-- Improvement annotations -->
  <text x="210" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60" font-weight="bold">58x faster</text>
  <text x="370" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60" font-weight="bold">50x faster</text>
  <text x="530" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60" font-weight="bold">53x faster</text>
  <text x="690" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60" font-weight="bold">36x faster</text>
</svg>
